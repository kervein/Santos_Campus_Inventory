<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify email | EquipTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card centered">
        <div class="mobile-brand">
            <span class="logo">ET</span> EquipTrack
        </div>

        <small class="section-label">EMAIL VERIFICATION</small>
        <h2>Enter your code</h2>
        <p class="hint">We sent a 6-digit code to {{ email }}. It expires in 10 minutes.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <label>
                Verification code
                <input name="code" required autofocus inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
            </label>
            <button class="btn green wide">Verify and create account</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('register') }}">← Start over</a>
        </div>
    </main>
</body>
</html>
